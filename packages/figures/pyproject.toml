[project]
name = "oran-causal-figures"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "oran-causal-analysis",
    "oran-causal-sim",
    "fonttools>=4.66.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oran_causal.figures"
