[project]
name = "oran-causal-core"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oran_causal.core"
