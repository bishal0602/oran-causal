[project]
name = "oran-causal-experiments"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "oran-causal-core",
    "oran-causal-sim",
    "oran-causal-methods",
    "oran-causal-analysis",
    "packaging",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
figures = ["oran-causal-figures"]

[project.scripts]
oran-causal = "oran_causal.experiments.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oran_causal.experiments"
