id: study2
platform: kaggle
claims:
- EMP-S2-PLACEBO
- EMP-S2-MAP
- EMP-S2-REFEREE
- EMP-S2-MECH
- EMP-S2-ASSOC
- PRO-FROZEN
- PRO-SEEDS
protocol:
  path: study2/PROTOCOL.md
  sha256: 71e57ae93b2ee79bcbe5d76d645189a988ebbd15d96c3b6a83da0806ca5adc5f
seeds:
- block: e6p_confounded_episodes
  range:
  - 186000
  - 187999
  role: confounded logs, knockout labels (186000-186079), referee evaluation
  world: E6
stages:
- name: collection
  driver: oran_causal.experiments.system.stages:run_stage
  args:
    study: 2
    stage:
    - dev
    - disc
    - placebo
  inputs:
  - protocols/study2/PROTOCOL.md
  outputs:
  - study2_raw/e6p-conf-dev-2-a
  - study2_raw/e6p-conf-disc-1-a
  - study2_raw/e6p-conf-disc-1-b
  - study2_raw/e6p-conf-placebo-1-a
  cost:
    cpu_h: 19
    basis: P
- name: knockout_gt
  driver: oran_causal.experiments.system.stages:run_stage
  args:
    study: 2
    stage: gt
  inputs:
  - protocols/study2/PROTOCOL.md
  outputs:
  - study2_raw/e6p-conf-gt-1-a
  - study2_raw/e6p-conf-gt-1-b
  cost:
    cpu_h: 42
    basis: P
  frozen_in:
  - t2
- name: analysis
  driver: oran_causal.analysis.system.study2:recompute_disc
  inputs:
  - study2_raw/e6p-conf-disc-1-a
  - study2_raw/e6p-conf-disc-1-b
  - study2_raw/e6p-conf-placebo-1-a
  outputs:
  - study2_raw/e6p-conf-discan-2/out
  cost:
    cpu_h: 2.3
    basis: M
- name: eval
  driver: oran_causal.experiments.system.stages:run_stage
  args:
    study: 2
    stage: eval
  inputs:
  - artifacts/study2_maps.json
  outputs:
  - study2_3_decision/runs/e6p-conf-eval-1
  - study2_3_decision/runs/e6p-conf-evalan-1
  cost:
    cpu_h: 58.74
    basis: M
frozen_inputs:
- path: artifacts/study2_maps.json
  sha256: c3c69db6601da7d8773d6c6f7a359007e419f4f8776898cf2e7d251a8c1e84a1
- path: artifacts/study1_pmrt.json
  sha256: 6f8e543145ad0e76afca653b17c4ea13b010c70d6b3134b109cd45fa0bcc99eb
records:
- set: study2_raw
  manifest: manifests/study2_raw.sha256
- set: study2_3_decision
  manifest: manifests/study2_3_decision.sha256
- set: system_artifacts
  manifest: manifests/system_artifacts.sha256
tiers:
  t0: recompute the discovery analysis and the evaluation criteria from the stored jobs (bytes)
  t1: null
  t2: collection, discovery analysis and referee evaluation re-run on the frozen knockout ground truth
  t3: collection, knockout ground truth, analysis and evaluation re-run
equivalence:
- metric: discovery
  rule: PASS
- metric: referee
  rule: 'NOT ELIGIBLE: RLF upper limit above the guard'
- metric: transmit-power to neighbour RLF edge
  rule: undeclared
- metric: point estimates
  rule: each falls inside the frozen 90 % interval
