id: study1
platform: kaggle
claims:
- EMP-S1-PLACEBO
- EMP-S1-NULLOUT
- EMP-S1-SMALLNULL
- EMP-S1-MAP
- EMP-S1-CHAIN
- EMP-S1-P2
- EMP-BASE-MAPS
- EMP-GT-LABELS
- EMP-ERLY
- PRO-FROZEN
- PRO-SEEDS
protocol:
  path: study1/DISCOVERY.md
  sha256: 1995be82103b1abd6020e156f1653fe0b32d7c87358b5a203335b289c04062f0
seeds:
- block: e6p_discovery_v4_episodes
  range:
  - 188000
  - 188019
  role: dev (before the freeze)
  world: E6
- block: e6p_discovery_v4_episodes
  range:
  - 188100
  - 188699
  role: 'eval: 600 randomised episodes, 10 slices of 60'
  world: E6
- block: e6p_discovery_v4_episodes
  range:
  - 188700
  - 188739
  role: placebo logs
  world: E6
- block: e6p_discovery_v4_episodes
  range:
  - 188800
  - 188839
  role: knockout ground truth
  world: E6
stages:
- name: collection
  driver: oran_causal.experiments.system.stages:run_stage
  args:
    study: 1
    stage:
    - dev
    - eval
    - placebo
  inputs:
  - protocols/study1/DISCOVERY.md
  outputs:
  - study1_raw/e6p-disc-v4dev-1-a
  - study1_raw/e6p-disc-v4ev-1-a
  - study1_raw/e6p-disc-v4ev-1-b
  - study1_raw/e6p-disc-v4plc-1-a
  cost:
    cpu_h: 12
    basis: M
- name: knockout_gt
  driver: oran_causal.experiments.system.stages:run_stage
  args:
    study: 1
    stage: gt
  inputs:
  - protocols/study1/DISCOVERY.md
  outputs:
  - study1_raw/e6p-disc-v4gt-1-a
  - study1_raw/e6p-disc-v4gt-1-b
  cost:
    cpu_h: 42
    basis: M
  frozen_in:
  - t2
- name: analysis
  driver: oran_causal.analysis.system.study1:recompute
  inputs:
  - artifacts/study1_pmrt.json
  - study1_raw/e6p-disc-v4an-1
  - study1_raw/e6p-disc-v4an-pmrt-1
  outputs:
  - system_artifacts/decision/v4_analysis.json
  - system_artifacts/report_2026-10-02/figures_data.json
  cost:
    cpu_h: 10
    basis: M
frozen_inputs:
- path: artifacts/study1_pmrt.json
  sha256: 6f8e543145ad0e76afca653b17c4ea13b010c70d6b3134b109cd45fa0bcc99eb
- path: artifacts/study1_mscr_plus.json
  sha256: 79816f317ac19212da4e426b75cb739a6b7bddcbcd2fe1ddadd93f91f2829f39
- path: protocols/study1/DISCOVERY_PMRT_ADDENDUM.md
  sha256: f1b5bea80d0545c467d1544ce0e7cbc75b83b43f581301c1515682e3c461c50b
records:
- set: study1_raw
  manifest: manifests/study1_raw.sha256
- set: study1_train
  manifest: manifests/study1_train.sha256
- set: system_artifacts
  manifest: manifests/system_artifacts.sha256
tiers:
  t0: recompute both analysis runs, the verdict and figures_data.json from the stored jobs (bytes)
  t1: two 120 s smoke episodes (eval, placebo) and the PMRT analysis at B 199 on the stored placebo records
  t2: collection and analysis re-run on the frozen knockout ground truth
  t3: collection, knockout ground truth and analysis re-run
equivalence:
- metric: verdict
  rule: PARTIAL, with P2 failing only against Granger + BY
- metric: conflict chain
  rule: 4 of 4 edges with the ground-truth sign
- metric: PMRT placebo declarations
  rule: '0'
- metric: point estimates
  rule: each falls inside the frozen 90 % interval
