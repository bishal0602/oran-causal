version: 1
claims:
  - id: DEF-SYS-UNIT
    kind: definition
    statement: "A decision unit is identified by a cell, an xApp and an opening time; its mode W_u, accept or reject, is drawn once at opening and holds for every request of the pair for 60 s."
    paper: [sec:units]
    spec: spec:sys.unit
    code: [oran_causal.sim.system.decision.units:HoldPolicy, oran_causal.sim.system.decision.units:T_UNIT]
    tests: {min: 1, tier: unit}

  - id: DEF-SYS-LOG
    kind: definition
    statement: "Three logging policies are considered: randomised (accept with probability 0.5), incumbent (propensity within [0.15, 0.85], depending on the request class and the cell state) and placebo (modes drawn and recorded, every request applied)."
    paper: [sec:units]
    spec: spec:sys.logging
    code:
      - oran_causal.sim.system.decision.collect:RandomizedUnitPolicy
      - oran_causal.sim.system.decision.collect:IncumbentPolicy
      - oran_causal.sim.system.decision.collect:PlaceboPolicy
    tests: {min: 1, tier: unit}

  - id: DEF-SYS-HYP
    kind: definition
    statement: "A hypothesis (f, r, k) concerns a parameter family f, a relation r and a KPI k; four families, three relations and five KPIs give m = 60 hypotheses, and the outcome y_u is the KPI summed over the cells of r in the 90 s after opening minus the same sum in the 90 s before."
    paper: [sec:estimand]
    spec: spec:sys.hyp
    code: [oran_causal.sim.system.decision.vocab:HYPOTHESES, oran_causal.core.data:UnitTable]
    tests: {min: 1, tier: unit}

  - id: DEF-EST-TAUPI
    kind: definition
    statement: "The policy-averaged assignment effect tau_pi of hypothesis (f, r, k) is the limit of the mean of sgn_u tau_u^pi over the units of f as the number of episodes grows (Definition 1)."
    paper: [def:tau_pi, eq:tau_u]
    spec: spec:est.taupi

  - id: DEF-EST-H0
    kind: definition
    statement: "The sharp null H0(f, r, k) states that the outcome a unit of f would have at any cell and opening time is the same under any assignment of f's modes; it is stated over keys, not realised units."
    paper: [sec:estimand, sec:inference, app:proof_setting]
    spec: spec:est.sharp

  - id: DEF-EST-TAUAA
    kind: definition
    statement: "The knockout effect tau_AA is the mean of sgn_u tau_u^AA, the accept-minus-reject difference of the 90 s post-window KPI sum in rollouts from the copied state with every other unit accepted (Definition 2)."
    paper: [def:tau_aa, tab:estimands]
    spec: spec:est.tauaa
    code: [oran_causal.sim.system.decision.gt:unit_delta]
    tests: {min: 1, tier: unit}

  - id: DEF-SYS-MITIG
    kind: definition
    statement: "Mitigation chooses a referee that minimises the protected-slice violations V subject to an energy retention of at least 0.90 and four guard ratios to accept-all of at most 1.10."
    paper: [sec:estimand, tab:arms]
    spec: spec:met.eligible
    tests: {min: 1, tier: unit}

  - id: DEF-PMRT-SCORE
    kind: definition
    statement: "The assignment score of unit u is v_u = sgn_u (L(W_u) - pi_u), with mean zero and variance pi_u (1 - pi_u) over the policy's draw."
    paper: [eq:score]
    spec: spec:pmrt.score
    code: [oran_causal.core.design:v_design]
    tests: {min: 1, tier: unit}

  - id: DEF-PMRT-WEIGHT
    kind: definition
    statement: "The weight w_u is built in seven steps: target bins, receiver slots, ridge adjustment, matched filter psi = Sigma^-1 mu, running score centre, Huber clip at a predicted scale, and orientation set where |z_train| >= 2."
    paper: [sec:pmrt, alg:pmrt, tab:pipeline]
    spec: spec:pmrt.weight
    code:
      - oran_causal.core.pmrt.units:fit_pmrt
      - oran_causal.core.pmrt.units:fit_core
      - oran_causal.core.pmrt.units:slot_matrix
      - oran_causal.core.pmrt.units:running_center
      - oran_causal.core.pmrt.units:h_weights
      - oran_causal.core.pmrt.units:modified
    tests: {min: 1, tier: unit}

  - id: DEF-PMRT-STAT
    kind: definition
    statement: "The statistic is S = sum_u v_u w_u with design variance sigma^2 = sum_u pi_u (1 - pi_u) w_u^2 and z = S / sigma; when sigma = 0 the code sets z = 0 and p = 1."
    paper: [eq:stat, app:proof_prop]
    spec: spec:pmrt.stat
    code: [oran_causal.core.pmrt.units:lin_z]
    tests: {min: 1, tier: unit}

  - id: DEF-PMRT-PVAL
    kind: definition
    statement: "The two-sided p-value is (1 + #{b : |z_b| >= |z|}) / (B + 1) with B = 9999 redraws of the family's modes, with one-sided values p_d where o is set; the code counts |z_b| >= |z| - 1e-9 (1 + |z|)."
    paper: [eq:pval, app:proof_prop]
    spec: spec:inf.pval
    code: [oran_causal.core.pmrt.engine:crt]
    tests: {min: 1, tier: unit}

  - id: DEF-PMRT-SUPPORT
    kind: definition
    statement: "A hypothesis is tested only when it has at least 30 units, 5 accepted, 5 rejected and 3 episodes; untested hypotheses count in m and are never declared."
    paper: [sec:inference, alg:pmrt]
    spec: spec:pmrt.support
    tests: {min: 1, tier: unit}

  - id: DEF-FDR-WBY
    kind: definition
    statement: "The 60 hypotheses of one analysis are declared together by a weighted Benjamini-Yekutieli step-up at q = 0.05, with Roeder-Wasserman weights (floor 0.2, cap 5, mean 1) and one-sided p-values in the prior direction where |z_prior| >= 3."
    paper: [sec:inference, tab:pipeline]
    spec: spec:fdr.wby
    depends_on: [CIT-RW]
    code:
      - oran_causal.core.multiplicity:weighted_step_up
      - oran_causal.core.declare:prior_weights
      - oran_causal.core.declare:prior_directions
      - oran_causal.core.declare:declare
    tests: {min: 2, tier: unit}

  - id: DEF-SLOPE
    kind: definition
    statement: "The design slope regresses each unit's centred outcome on its assignment score, beta_hat = sum_u v_u e_u / sum_u v_u^2, which at pi_u = 0.5 is the Horvitz-Thompson estimator of tau_pi."
    paper: [eq:slope_ht, sec:slope]
    spec: spec:ref.slope
    code: [oran_causal.core.gate:design_slope_se]
    tests: {min: 1, tier: unit}

  - id: DEF-REF-RULES
    kind: definition
    statement: "The map-driven referee applies four rules with the same constants for every map: effects, harm, rejection (costly or pressure above 0.05) and guard conflict."
    paper: [sec:referee]
    spec: spec:ref.rules
    code: [oran_causal.methods.system.referees:MapGateV2]
    tests: {min: 1, tier: unit}

  - id: DEF-GATE
    kind: definition
    statement: "The edge-certification gate lets the referee reject a class only when every undeclared guard edge of the class has a one-sided 90 % upper bound of h beta at most the tolerance epsilon(f, d, k) = 0.05 G_k / (3 max{N(f, d), 1})."
    paper: [sec:gate, eq:tol]
    spec: spec:gate
    code:
      - oran_causal.core.gate:tau_table
      - oran_causal.core.gate:bound_ub
      - oran_causal.core.gate:classify_edge
      - oran_causal.core.gate:certify
    tests: {min: 1, tier: unit}

  - id: DEF-GT-LABEL
    kind: definition
    statement: "A hypothesis is labelled true, with the sign of its mean, when its 95 % episode-cluster bootstrap interval excludes zero and the absolute mean is at least delta_k (5 % of the largest absolute mean of KPI k, floor 0.5 for protected-slice violations); null when the interval lies within +-delta_k; otherwise unscored, as with fewer than 10 units or 3 episodes."
    paper: [sec:gt]
    spec: spec:gt.label
    code: [oran_causal.sim.system.decision.gt:classify, oran_causal.sim.system.decision.gt:cluster_boot]
    tests: {min: 1, tier: unit}

  - id: DEF-MET-MAP
    kind: definition
    statement: "Maps are scored over the 60 hypotheses by precision, recall, F1 and sign accuracy."
    paper: [sec:baselines_scores]
    spec: spec:met.map
    code: [oran_causal.core.scoring:score_method, oran_causal.core.scoring:confusion]
    tests: {min: 1, tier: unit}

  - id: DEF-MET-DEC
    kind: definition
    statement: "Referees are compared by the recovery R = (V_AA - V) / (V_AA - V_ref) and eligibility, with 90 % paired seed-bootstrap intervals (10,000 resamples) on decision metrics and 95 % cluster-bootstrap intervals on rates; an ineligible arm scores R* = min(R, 0)."
    paper: [sec:baselines_scores, app:arms, tab:arms]
    spec: spec:met.decision
    code: [oran_causal.analysis.system.stats:gate_a]
    tests: {min: 1, tier: unit}

  - id: DEF-ENV
    kind: definition
    statement: "The controlled environments are five mechanisms with known causal graphs (linear graph, rare regime, delayed harm, latent confounding, composed), logged by independent redraws, a dithered setpoint, a confounded policy or unlogged confounding, at n from 500 to 24,000."
    paper: [sec:envs, app:envs, tab:study4_design]
    spec: spec:env
    code: [oran_causal.sim.controlled.datasets.generate:generate_dataset, oran_causal.sim.controlled.datasets.truth:truth_for, oran_causal.sim.controlled.base:ControlledEnv, oran_causal.experiments.campaign.estimand:run]
    tests: {min: 1, tier: unit}

  - id: DEF-ENV-ARMS
    kind: definition
    statement: "In the controlled environments, the design-based tests are PMRT-GBM and PMRT-Lin with plain BY at q = 0.05 and without the Huber clip; design-adjusted and design-blind tests are compared against them."
    paper: [sec:envs]
    spec: spec:env.arms
    code: [oran_causal.core.pmrt.rows:PmrtCore, oran_causal.methods.registry:resolve]
    tests: {min: 1, tier: unit}

  - id: DEF-SIM-CONST
    kind: definition
    statement: "The simulator has 24 cells and 300 UEs, a 40 ms tick and 120 s warm-up plus 600 s scored time; the gate tolerances used G_v = 19,953.65 violated UE-seconds and G_RLF = 35.025 RLFs."
    paper: [sec:scenario, app:simparams]
    spec: spec:sys.sim
    code: [oran_causal.core.gate:tau_table, oran_causal.sim.system.config:E6Config, oran_causal.sim.system.config:TICK_S, oran_causal.sim.system.env:E6Env]
    tests: {min: 1, tier: unit}
    evidence:
      - record: system_artifacts/report_2026-10-02/figures_data.json
        sha256: 85fe7cfffdad21b742763919c1f71b55fc611361ecd85b38eaa86918e15db74e
        pointer: /certsafe/calib/G
        expect: {v: 19953.65, rlf: 35.025}

  - id: ASM-A1-DESIGN
    kind: assumption
    statement: "(A1) For every unit u, its existence, cell, opening time, direction and propensity are G_{u-1}-measurable, Pr(W_u = accept | G_{u-1}) = pi_u, and pi_min <= pi_u <= 1 - pi_min."
    paper: [sec:inference, app:proof_setting]
    spec: spec:asm.a1
    probes: [EMP-X3]
    code: [oran_causal.sim.system.decision.collect:IncumbentPolicy]
    tests: {min: 1, tier: unit}

  - id: ASM-A2-NULL
    kind: assumption
    statement: "(A2) The sharp null H0(f, r, k) holds; it is the hypothesis under test."
    paper: [sec:inference]
    spec: spec:asm.a2
    probes: [EMP-S1-PLACEBO, EMP-S2-PLACEBO]

  - id: ASM-A3-PRED
    kind: assumption
    statement: "(A3) Every weight w_u is G_{u-1}-measurable."
    paper: [sec:inference, app:proof_setting]
    spec: spec:asm.a3
    probes: [EMP-S1-NULLOUT, EMP-S1-STRICT]
    code: [oran_causal.core.pmrt.units:running_center, oran_causal.core.ridge:predictable_residuals]
    tests: {min: 3, tier: unit}

  - id: ASM-A4-REG
    kind: assumption
    statement: "(A4) As the number of episodes grows, the design variance grows without any single unit dominating S; it is the one assumption the construction leaves open."
    paper: [sec:inference, app:assumptions, app:proof_setting]
    spec: spec:asm.a4
    probes: [EMP-S1-PLACEBO, EMP-S1-NULLOUT, EMP-S1-STRICT]
    tests: {min: 1, tier: t0}

  - id: ASM-FDR-FIXED
    kind: assumption
    statement: "The declaration weights omega_j and directions d_j are fixed from data independent of the evaluation data."
    paper: [cor:fdr, app:proof_cor]
    spec: spec:asm.v2
    code: [oran_causal.core.declare:prior_weights, oran_causal.core.declare:prior_directions]
    tests: {min: 1, tier: unit}

  - id: ASM-ORIENT
    kind: assumption
    statement: "The orientation o used by the one-sided p-values is fixed in advance."
    paper: [prop:pmrt]
    spec: spec:asm.orient
    code: [oran_causal.core.pmrt.units:fit_pmrt]
    tests: {min: 1, tier: unit}

  - id: ASM-SLOPE-CENTRE
    kind: assumption
    statement: "The design slope and the gate bounds rest on an approximately predictable outcome centre; the implemented centre also uses earlier outcomes whose windows are still open."
    paper: [sec:slope, sec:disc_limits, app:gate]
    spec: spec:asm.centre
    probes: [EMP-X16]
    tests: {min: 1, tier: unit}

  - id: ASM-GATE-COV
    kind: assumption
    statement: "The gate's 90 % bound is approximate; its coverage, policy-level safety and the protected slice are not covered by a guarantee."
    paper: [tab:guarantees, sec:gate]
    spec: spec:asm.gatecov
    probes: [EMP-S3-GATED]
    code: [oran_causal.core.gate:bound_ub]

  - id: ASM-S4-KNOWN
    kind: assumption
    statement: "The controlled-environment claims assume that the logged design is known and correctly specified."
    paper: [sec:envs, sec:disc_deploy]
    spec: spec:asm.known
    probes: [EMP-X3]
    tests: {min: 1, tier: unit}

  - id: THM-FRESH
    kind: theorem-paper
    statement: "In the setting of app:proof_setting (draws U_xi independent Uniform(0, 1) over keys and independent of G_0; G_u = G_0 v sigma(U_{xi_1}, ..., U_{xi_u})), if xi_u and pi_u are G_{u-1}-measurable and xi_u differs from the earlier keys, then U_{xi_u} is Uniform(0, 1) and independent of G_{u-1}, so Pr(W_u = accept | G_{u-1}) = pi_u (Lemma 1)."
    paper: [lem:fresh]
    spec: spec:thm.fresh

  - id: THM-PMRT-ASY
    kind: theorem-paper
    statement: "Under (A1) to (A3), S is a martingale with predictable quadratic variation sigma^2; with (A4), z converges to N(0, 1), the redraw distribution converges uniformly to Phi in probability, and limsup Pr(p <= t) <= floor(t (B + 1)) / (B + 1) <= t (Proposition 1)."
    paper: [prop:pmrt, app:proof_prop]
    spec: spec:thm.pmrt
    depends_on: [ASM-A1-DESIGN, ASM-A2-NULL, ASM-A3-PRED, ASM-A4-REG, THM-FRESH, CIT-HH, CIT-DUR]
    code: [oran_causal.core.pmrt.engine:crt]
    tests: {min: 1, tier: unit}

  - id: THM-EXACT
    kind: theorem-paper
    statement: "If, in addition to (A1) and (A2), the realised units, their order, sgn_u, pi_u and w_u are all G_0-measurable, then Pr(p <= t | G_0) <= t for every t in [0, 1], every n and every B, and likewise for p_d with the direction d fixed and the orientation o G_0-measurable (set from training data) (Lemma 2)."
    paper: [lem:exact]
    spec: spec:thm.exact
    depends_on: [ASM-A1-DESIGN, ASM-A2-NULL, THM-FRESH, CIT-PS]
    code: [oran_causal.core.pmrt.engine:crt]
    tests: {min: 1, tier: unit}

  - id: THM-COUNTEREX
    kind: theorem-paper
    statement: "In a two-unit design where a rejected unit is proposed again, Pr(p_{+1} <= 1/2) = 3/4 > 1/2, so re-proposal alone breaks finite-sample validity (Example 1)."
    paper: [ex:adaptive]
    spec: spec:thm.counterex
    depends_on: [DEF-PMRT-PVAL]
    tests: {min: 1, tier: unit}

  - id: THM-BY-FIN
    kind: theorem-lean
    statement: "For any rejection set S with p_j <= t_j(|S|) for every j in S, where t_j(k) = q w_j k / (m c_m), the false discovery rate is at most (q/m) sum_{j in H0} w_j + |H0| delta whenever every null p-value satisfies Pr(p_j <= t_j(i)) <= t_j(i) + delta for i = 1..m, whatever the dependence between the p-values."
    paper: [app:proof_cor, cor:fdr]
    spec: spec:thm.byfin
    depends_on: [CIT-BY, CIT-BR]
    code: [oran_causal.core.multiplicity:weighted_step_up]
    lean: {decl: OranCausal.StepUp.fdr_le_of_selfConsistent, axioms: [propext, Classical.choice, Quot.sound]}
    tests: {min: 2, tier: unit}

  - id: THM-FDR-ASY
    kind: theorem-paper
    statement: "If (A1) to (A4) hold for every true sharp null and the weights and directions are fixed from independent data, then limsup FDR <= (q/m) sum_{j in H0} omega_j <= q whatever the dependence between the p-values (Corollary 1)."
    paper: [cor:fdr, eq:fdr, app:proof_cor]
    spec: spec:thm.fdr
    depends_on: [THM-BY-FIN, THM-PMRT-ASY, ASM-FDR-FIXED]
    code: [oran_causal.core.multiplicity:weighted_step_up]
    tests: {min: 1, tier: unit}

  - id: THM-SLOPE
    kind: theorem-paper
    statement: "Under (A1) with the natural history, bounded outcomes and a predictable centre, beta_hat converges to the pi_u (1 - pi_u)-weighted average of sgn_u tau_u^pi; at pi_u = 0.5 it is the Horvitz-Thompson estimator as an identity (Lemma 3)."
    paper: [lem:slope, app:proof_slope]
    spec: spec:thm.slope
    depends_on: [ASM-A1-DESIGN, DEF-SLOPE]
    code: [oran_causal.core.gate:design_slope_se]
    tests: {min: 1, tier: unit}

  - id: THM-GATE-BUDGET
    kind: theorem-paper
    statement: "If every unit of a class were rejected and each rejection moved a guard KPI by at most epsilon on each of the three relations, the guard ratio would move by at most 0.05."
    paper: [sec:gate]
    spec: spec:gate.budget
    depends_on: [DEF-GATE]
    code: [oran_causal.core.gate:tau_table]
    tests: {min: 1, tier: unit}

  - id: THM-SCOPE
    kind: theorem-paper
    statement: "The FDR bound covers the declared edge, not its sign, relation or magnitude; when f affects its own cells, the neighbour and far hypotheses of f are false and declaring them is correct."
    paper: [sec:reading, tab:guarantees]
    spec: spec:thm.scope
    depends_on: [THM-FDR-ASY]

  - id: CIT-BY
    kind: theorem-cited
    statement: "The Benjamini-Yekutieli step-up controls the FDR under arbitrary dependence."
    paper: [sec:inference, app:proof_cor]
    spec: spec:thm.byfin
    cited: {bibkey: benjamini2001dependency, locator: "no locator in the manuscript", verified: false}

  - id: CIT-BR
    kind: theorem-cited
    statement: "The weighted step-up with a reshaping function controls the FDR at q sum_{H0} w_j / m under arbitrary dependence when the null p-values are super-uniform."
    paper: [app:proof_cor]
    spec: spec:thm.byfin
    cited: {bibkey: blanchard2008fdr, locator: "Thm. 4.2", verified: false}

  - id: CIT-HH
    kind: theorem-cited
    statement: "The martingale central limit theorem with a random limiting variance and its self-normalised form."
    paper: [app:proof_prop]
    spec: spec:thm.pmrt
    cited: {bibkey: hall1980martingale, locator: "Cor. 3.1, Cor. 3.2", verified: false}

  - id: CIT-DUR
    kind: theorem-cited
    statement: "The Lindeberg-Feller theorem and Polya's theorem on uniform convergence of distribution functions."
    paper: [app:proof_prop]
    spec: spec:thm.pmrt
    cited: {bibkey: durrett2019probability, locator: "Thm. 3.4.10; Exercise 3.2.9", verified: false}

  - id: CIT-PS
    kind: theorem-cited
    statement: "The Monte Carlo p-value that counts ties against the observed statistic is valid for every B when the B + 1 values are exchangeable."
    paper: [lem:exact]
    spec: spec:thm.exact
    cited: {bibkey: phipson2010permutation, locator: "Sect. 4", verified: false}

  - id: CIT-RW
    kind: theorem-cited
    statement: "Roeder-Wasserman weights for weighted multiple testing."
    paper: [sec:inference, tab:pipeline]
    spec: spec:fdr.weights
    code: [oran_causal.core.multiplicity:rw_weights]
    cited: {bibkey: roeder2009weighted, locator: "no locator in the manuscript", verified: false}

  - id: EMP-S1-PLACEBO
    kind: empirical
    statement: "On the randomised placebo logs PMRT declared nothing; 7 of the 60 p-values were at or below 0.05 where 3 were expected, with a binomial tail probability of 0.03 above the protocol limit of 0.01."
    paper: [abstract, sec:res_validity, tab:validity, fig:placebo]
    spec: spec:met.validity
    depends_on: [DEF-FDR-WBY, DEF-SYS-LOG]
    code: [oran_causal.analysis.system.report_data:v4]
    tests: {min: 1, tier: t0}
    evidence:
      - record: system_artifacts/report_2026-10-02/figures_data.json
        sha256: 85fe7cfffdad21b742763919c1f71b55fc611361ecd85b38eaa86918e15db74e
        pointer: /v4/K0
        expect: {m: 60, n_reject: 7, binom_tail: 0.0296941, n_declared: 0, pass: true}

  - id: EMP-S2-PLACEBO
    kind: empirical
    statement: "On the confounded placebo logs PMRT declared nothing, with 0 of 60 p-values at or below 0.05."
    paper: [abstract, sec:res_validity, tab:validity]
    spec: spec:met.validity
    depends_on: [DEF-FDR-WBY, DEF-SYS-LOG]
    code: [oran_causal.analysis.system.report_data:opt_a]
    tests: {min: 1, tier: t0}
    evidence:
      - record: system_artifacts/report_2026-10-02/figures_data.json
        sha256: 85fe7cfffdad21b742763919c1f71b55fc611361ecd85b38eaa86918e15db74e
        pointer: /option_a/disc/K0
        expect: {pass: true, n_reject: 0, m: 60, n_declared: 0, min_p: 0.0639}

  - id: EMP-S1-NULLOUT
    kind: empirical
    statement: "On null outcomes PMRT declared nothing, with p-value rates at or below 0.05 of 0.053 (families 0.047-0.060) on the randomised and 0.050 (0.038-0.063) on the confounded logs, using 999 redraws."
    paper: [sec:res_validity, tab:validity]
    spec: spec:met.validity
    depends_on: [DEF-PMRT-PVAL]
    code: [oran_causal.analysis.system.report_data:v4]
    tests: {min: 1, tier: t0}
    evidence:
      - record: system_artifacts/report_2026-10-02/figures_data.json
        sha256: 85fe7cfffdad21b742763919c1f71b55fc611361ecd85b38eaa86918e15db74e
        pointer: /v4/K0n
        expect: {pass: true, rate05: 0.0525, n_variants_with_decl: 0}
      - record: system_artifacts/report_2026-10-02/figures_data.json
        sha256: 85fe7cfffdad21b742763919c1f71b55fc611361ecd85b38eaa86918e15db74e
        pointer: /option_a/disc/K0n
        expect: {pass: true, rate05: 0.05, n_variants_with_decl: 0}

  - id: EMP-S1-STRICT
    kind: empirical
    statement: "Repeated with 9,999 redraws on 590 null-outcome variants of the randomised logs, declarations occurred in 2 variants, within the limit of 7.5 %, and the shares of p-values at or below 1e-3 and 2e-4 were 7.9e-4 and 1.1e-4; the evidence rests on ten logged designs."
    paper: [sec:res_validity, app:validity, tab:validity, sec:disc_deploy]
    spec: spec:met.validity
    depends_on: [DEF-PMRT-PVAL, DEF-FDR-WBY]
    tests: {min: 1, tier: t0}
    posthoc: true

  - id: EMP-S1-SMALLNULL
    kind: empirical
    statement: "Over the 21 hypotheses that the ground truth labels null, the rate of p-values at or below 0.05 was 0.15 (0.048-0.29); over the 12 whose knockout interval also contains zero it was 0.075 (0.017-0.16)."
